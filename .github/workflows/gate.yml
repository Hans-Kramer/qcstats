#
# The gate from the README, run automatically. Nothing here is fetched or
# vendored beyond the compilers themselves: qcstats has no dependencies.

name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc clang gcc-aarch64-linux-gnu

      - name: Assert every toolchain is present
        # `make check` SKIPS a compiler it cannot find, with a notice rather
        # than a failure. That is right on a developer's machine and wrong
        # here: a runner missing clang would report a green gate while having
        # checked half of it. Fail loudly instead.
        run: |
          for c in gcc clang aarch64-linux-gnu-gcc; do
            command -v "$c" >/dev/null 2>&1 || { echo "::error::missing toolchain: $c"; exit 1; }
            printf '%-24s %s\n' "$c" "$("$c" --version | head -1)"
          done

      - name: make check
        run: make check

      - name: make test
        # `check` compiles; this runs code. Each test file returns non-zero if any check
        # failed OR if it checked nothing at all - a suite that cannot fail is not a gate.
        run: |
          out=$(make test 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          # A shell test that skips is a test that is not running. On a runner there is
          # nothing to be missing, so a skip is a fault, not a notice.
          if printf '%s\n' "$out" | grep -q SKIPPED; then
            echo "::error::a test skipped in CI, where it has to run"
            exit 1
          fi

      - name: Cross-build for the board
        # `make check` is native-only. char is unsigned on aarch64 and signed
        # on x86, so the cross build is part of the gate, not a release step.
        run: make cross

      - name: Assert the cross build really produced an aarch64 binary
        # e_machine lives at ELF offset 18; 0xb7 is aarch64. od rather than
        # file(1), matching the Makefile: od is always present.
        run: |
          got=$(od -An -tx1 -j18 -N1 qcstats | tr -d ' \n')
          echo "e_machine = 0x$got"
          [ "$got" = "b7" ] || { echo "::error::not an aarch64 binary"; exit 1; }

      - name: Every file carries an SPDX identifier
        # The project's own convention, enforced. This is what a REUSE lint
        # would check; doing it inline keeps the zero-dependency promise.
        run: |
          rc=0
          for f in $(git ls-files); do
            case "$f" in
              LICENSE|LICENSES/*) continue ;;
              # Captured sysfs/procfs values: machine output, not authored content.
              # tests/fixtures/README.md carries the declaration for the whole tree.
              tests/fixtures/*/*) continue ;;
            esac
            grep -qI "SPDX-License-Identifier:" "$f" 2>/dev/null \
              || { echo "::error file=$f::no SPDX-License-Identifier"; rc=1; }
          done
          exit $rc

  aarch64:
    # The board's architecture. Until now it was compiled and never executed: char is
    # unsigned on aarch64 and signed on x86, and the suite is what makes that difference
    # visible. GitHub's arm64 Linux runners are free for public repositories; if this job
    # cannot find a runner, that is what the first run will say.
    #
    # No cross toolchain here - native IS the board's architecture - and no `make cross`,
    # which would be a cross build to the machine it is already running on.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc clang

      - name: make check
        run: make check

      - name: make test
        run: |
          out=$(make test 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          # A shell test that skips is a test that is not running. On a runner there is
          # nothing to be missing, so a skip is a fault, not a notice.
          if printf '%s\n' "$out" | grep -q SKIPPED; then
            echo "::error::a test skipped in CI, where it has to run"
            exit 1
          fi

      - name: Assert these binaries really are aarch64
        # The same e_machine read the x86 job does on the cross build, for the opposite
        # reason: there it proves the cross compiler was used, here that the runner is
        # the architecture it claims.
        run: |
          make all
          got=$(od -An -tx1 -j18 -N1 qcstats | tr -d ' \n')
          echo "e_machine = 0x$got"
          [ "$got" = "b7" ] || { echo "::error::this runner did not produce aarch64"; exit 1; }
